name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'App/**'
              - 'Packages/**'
              - 'scripts/verify.sh'
              - '.github/workflows/ci.yml'

  engine:
    runs-on: ubuntu-latest
    container: swift:6.4.1
    steps:
      - uses: actions/checkout@v7
      - run: scripts/verify.sh engine

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: scripts/verify.sh app
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: TestResults.xcresult
          path: build/TestResults.xcresult
          if-no-files-found: ignore

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: scripts/verify.sh supabase
